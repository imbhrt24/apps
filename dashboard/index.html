<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<script>try{var _s=JSON.parse(localStorage.getItem('lifeDashboard.v4')||'{}');document.documentElement.setAttribute('data-theme',(_s&&_s.settings&&_s.settings.theme==='dark')?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
<style>
:root{
  --bg:#f6f7f9;--bg2:#eef0f3;--surface:#ffffff;--surface-hover:#f4f5f8;--sidebar:#fbfbfc;
  --border:#e7e8ec;--border-strong:#d8dade;--text:#16171a;--text2:#646a73;--text3:#9aa0aa;
  --accent:#5e6ad2;--accent-hover:#4f5ac4;--accent-soft:#edeefb;
  --danger:#e5484d;--danger-soft:#fdecec;--success:#2f9e60;--warn:#d98014;--warn-soft:#fbf1e3;--blue:#0ea5e9;
  --toast-bg:#16171a;--toast-fg:#ffffff;--dashed-bg:rgba(255,255,255,.4);
  --r:10px;--r-sm:7px;--r-lg:18px;
  --sh-sm:0 1px 2px rgba(16,17,26,.05),0 1px 3px rgba(16,17,26,.06);
  --sh-md:0 4px 14px rgba(16,17,26,.09),0 1px 3px rgba(16,17,26,.05);
  --sh-lg:0 24px 60px rgba(16,17,26,.22),0 6px 16px rgba(16,17,26,.12);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e0f11;--bg2:#191a1e;--surface:#17181b;--surface-hover:#212227;--sidebar:#121316;
  --border:#292a30;--border-strong:#3a3c44;--text:#f2f3f4;--text2:#a3a8b2;--text3:#6c717b;
  --accent:#7f8bf0;--accent-hover:#909bf3;--accent-soft:#252840;
  --danger:#f0676c;--danger-soft:#33191b;--success:#41b57e;--warn:#e0942e;--warn-soft:#2e2413;--blue:#38bdf8;
  --toast-bg:#2b2d34;--toast-fg:#f2f3f4;--dashed-bg:rgba(255,255,255,.02);
  --sh-sm:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.28);
  --sh-md:0 4px 14px rgba(0,0,0,.42),0 1px 3px rgba(0,0,0,.3);
  --sh-lg:0 24px 60px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
::placeholder{color:var(--text3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text3);background-clip:padding-box}

.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.brand-logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#8b94e8);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh-sm)}
.brand-name{font-weight:600;font-size:14.5px;letter-spacing:-.02em}
.nav-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:10px 8px 6px;display:flex;align-items:center}
.nav-label .add{margin-left:auto;width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.nav-label .add:hover{background:var(--surface-hover);color:var(--accent)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-sm);color:var(--text2);font-weight:450;font-size:13.5px;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-item .em{width:18px;text-align:center;flex:0 0 18px}
.nav-item .ico{display:flex;width:18px;height:18px;flex:0 0 18px}
.sidebar-foot{margin-top:auto;padding-top:10px}
.kbd{font-size:11px;color:var(--text3);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:var(--surface);margin-left:auto}

.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--border);background:var(--bg)}
.topbar h1{font-size:16px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.topbar h1 .em{font-size:17px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--text);box-shadow:var(--sh-sm);transition:.12s}
.btn:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.btn:active{transform:translateY(.5px)}
.btn .ico{width:15px;height:15px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-icon{padding:7px}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--surface-hover)}
.btn-sm{padding:5px 9px;font-size:12.5px}
.btn-danger{color:var(--danger);border-color:var(--border)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.search-pill{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 11px;box-shadow:var(--sh-sm);color:var(--text3);font-size:13px;min-width:190px}
.search-pill:hover{border-color:var(--border-strong)}
.search-pill .ico{width:15px;height:15px}
.search-pill .kbd{margin-left:auto}

.content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* overview */
.ov{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;animation:fade .3s}
.ov .hello{font-size:38px;font-weight:600;letter-spacing:-.03em}
.ov .clock{margin-top:12px;color:var(--text2);font-size:16px;font-weight:450}
.ov .date{color:var(--text3);font-size:14px;margin-top:2px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* tabbar */
.tabbar{display:flex;align-items:center;gap:4px;padding:10px 22px 0;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;font-size:13.5px;font-weight:500;color:var(--text2);border:1px solid transparent;border-bottom:none;position:relative;top:1px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.12s}
.tab:hover{background:var(--surface-hover);color:var(--text)}
.tab.active{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:0 -2px 6px rgba(16,17,26,.03)}
.tab .ti{width:14px;height:14px;display:flex;color:var(--text3)}
.tab.active .ti{color:var(--accent)}
.tab-add{padding:7px 9px;border-radius:7px;color:var(--text3)}
.tab-add:hover{background:var(--surface-hover);color:var(--accent)}
.tab-tools{margin-left:auto;display:flex;gap:4px;padding-bottom:6px}

.tabpane{flex:1;overflow:auto}
.pane-pad{padding:22px;max-width:1100px}

/* board */
.board{flex:1;display:flex;gap:14px;align-items:flex-start;padding:18px 22px 28px;overflow-x:auto;overflow-y:hidden;height:100%}
.tcolumn{flex:0 0 286px;max-height:100%;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);transition:box-shadow .15s}
.tcolumn.col-dragging{opacity:.5;box-shadow:var(--sh-lg)}
.tcolumn.collapsed{flex-basis:46px;align-items:center}
.tcolumn.collapsed .col-cards,.tcolumn.collapsed .col-foot,.tcolumn.collapsed .col-title input{display:none}
.tcolumn.collapsed .col-head{writing-mode:vertical-rl;padding:12px 0}
.col-head{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;cursor:grab}
.col-title{flex:1;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;min-width:0}
.col-title input{font-weight:600;font-size:13.5px;border:none;background:none;outline:none;width:100%;border-radius:5px;padding:2px 4px}
.col-title input:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft)}
.col-count{font-size:11.5px;color:var(--text3);background:var(--surface);border-radius:20px;padding:1px 8px;font-weight:600}
.col-menu-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.col-menu-btn:hover{background:var(--surface);color:var(--text)}
.col-cards{flex:1;overflow-y:auto;padding:2px 9px 4px;display:flex;flex-direction:column;gap:8px;min-height:8px}
.col-foot{padding:7px 9px 10px}
.add-card-btn{width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-sm);color:var(--text2);font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;transition:.12s}
.add-card-btn:hover{background:var(--surface);color:var(--text)}
.add-card-btn .ico{width:14px;height:14px}
.composer textarea{width:100%;border:1px solid var(--accent);border-radius:var(--r-sm);padding:9px 10px;resize:none;outline:none;box-shadow:var(--sh-sm);font-size:13.5px;min-height:62px;line-height:1.45}
.composer .row{display:flex;gap:8px;margin-top:7px;align-items:center}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--sh-sm);overflow:hidden;cursor:pointer;transition:box-shadow .14s,transform .06s,border-color .14s;animation:cardin .18s}
@keyframes cardin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tcard:hover{box-shadow:var(--sh-md);border-color:var(--border-strong);transform:translateY(-1px)}
.tcard.dragging{opacity:.4;box-shadow:var(--sh-lg)}
.tcard-cover{height:7px}
.tcard-in{padding:9px 11px 10px}
.tcard-labels{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.tlabel{height:8px;width:30px;border-radius:20px}
.tlabel.named{width:auto;height:auto;padding:1px 8px;font-size:10.5px;font-weight:600;color:#fff}
.tcard-title{font-size:13.5px;font-weight:500;line-height:1.4;word-break:break-word}
.tcard-badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;color:var(--text3);font-size:11.5px;font-weight:500;align-items:center}
.tcard-badges .b{display:inline-flex;align-items:center;gap:4px}
.tcard-badges .b .ico{width:13px;height:13px}
.badge-due{padding:1px 7px;border-radius:5px}
.badge-due.soon{background:var(--warn-soft,#fbf1e3);color:var(--warn)}
.badge-due.over{background:var(--danger-soft);color:var(--danger)}
.badge-cl.done{color:var(--success)}
.add-col{flex:0 0 286px}
.add-col-btn{width:100%;padding:12px 14px;border-radius:var(--r);border:1.5px dashed var(--border-strong);color:var(--text3);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:.12s;background:var(--dashed-bg)}
.add-col-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.add-col-btn .ico{width:15px;height:15px}

/* popover menu */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-lg);padding:6px;min-width:188px;animation:fade .12s}
.pop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--text)}
.pop button:hover{background:var(--surface-hover)}
.pop button.danger{color:var(--danger)}
.pop button .ico{width:15px;height:15px;color:var(--text3)}
.pop .sep{height:1px;background:var(--border);margin:5px 0}
.pop .swrow{display:flex;gap:6px;padding:6px 8px;flex-wrap:wrap}
.pop .sw{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.pop .sw.sel{border-color:var(--text)}

/* workspace modal */
.ws-overlay,.cmdk-overlay,.set-overlay{position:fixed;inset:0;background:rgba(16,17,26,.46);backdrop-filter:blur(3px);display:none;z-index:60;animation:fade .14s}
.ws-overlay.open,.cmdk-overlay.open,.set-overlay.open{display:flex}
.ws-overlay{align-items:center;justify-content:center;padding:4vh 0}
.ws-modal{width:70vw;max-width:1080px;height:86vh;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .16s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.ws-cover{height:10px;flex:0 0 auto}
.ws-head{display:flex;align-items:center;gap:12px;padding:16px 24px 12px}
.cover-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-hover);flex:0 0 auto}
.cover-btn:hover{border-color:var(--accent)}
.ws-head-mid{flex:1;min-width:0}
.crumb{font-size:11.5px;color:var(--text3);font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.crumb .sep{opacity:.5}
.ws-title{font-size:21px;font-weight:600;letter-spacing:-.02em;border:none;background:none;outline:none;width:100%;padding:2px 0}
.saved{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;flex:0 0 auto}
.saved .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.ws-close{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex:0 0 auto}
.ws-close:hover{background:var(--surface-hover);color:var(--text)}
.ws-body{flex:1;overflow-y:auto;padding:6px 24px 24px;display:grid;grid-template-columns:1fr 240px;gap:26px}
.ws-main{min-width:0}
.ws-side{border-left:1px solid var(--border);padding-left:22px}
.ws-foot{display:flex;align-items:center;padding:12px 24px;border-top:1px solid var(--border)}
.blk{margin-bottom:22px}
.blk-h{font-size:11.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.blk-h .ico{width:14px;height:14px;color:var(--text3)}
.blk-h .add{margin-left:auto;font-size:12px;color:var(--accent);font-weight:500;text-transform:none;letter-spacing:0;display:inline-flex;align-items:center;gap:4px}

.rt-toolbar{display:flex;gap:2px;flex-wrap:wrap;border:1px solid var(--border);border-bottom:none;border-radius:var(--r-sm) var(--r-sm) 0 0;padding:5px;background:var(--bg)}
.rt-toolbar button{width:30px;height:28px;border-radius:6px;color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
.rt-toolbar button:hover{background:var(--surface)}
.rt-toolbar .ico{width:15px;height:15px}
.rt-editor{border:1px solid var(--border);border-radius:0 0 var(--r-sm) var(--r-sm);padding:13px 14px;min-height:150px;outline:none;line-height:1.65;font-size:14px}
.rt-editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rt-editor h2{font-size:18px;margin:6px 0}.rt-editor h3{font-size:15px;margin:5px 0}
.rt-editor ul,.rt-editor ol{padding-left:22px;margin:6px 0}
.rt-editor a{color:var(--accent)}
.rt-editor.big{min-height:60vh}
.rt-editor:empty:before{content:attr(data-ph);color:var(--text3)}

.checklist{margin-bottom:16px}
.cl-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.cl-head input{font-weight:600;font-size:13.5px;border:none;background:none;outline:none;flex:1;border-radius:5px;padding:2px 4px}
.cl-head input:focus{background:var(--surface-hover)}
.cl-prog{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-bottom:8px}
.cl-prog div{height:100%;background:var(--success);border-radius:6px;transition:width .25s}
.cl-item{display:flex;align-items:center;gap:9px;padding:3px 0}
.chk{width:18px;height:18px;border-radius:5px;border:1.6px solid var(--border-strong);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.chk.on{background:var(--success);border-color:var(--success)}
.chk .ico{width:12px;height:12px}
.cl-item input{flex:1;border:none;background:none;outline:none;font-size:13.5px;border-radius:5px;padding:4px 5px}
.cl-item input:focus{background:var(--surface-hover)}
.cl-item.done input{text-decoration:line-through;color:var(--text3)}
.cl-item .del{width:24px;height:24px;border-radius:5px;color:var(--text3);display:none;align-items:center;justify-content:center;flex:0 0 auto}
.cl-item:hover .del{display:flex}.cl-item .del:hover{color:var(--danger);background:var(--danger-soft)}
.mini{font-size:12.5px;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:5px;padding:5px 0}
.mini .ico{width:13px;height:13px}

.link-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;background:var(--surface)}
.link-item .ico{width:14px;height:14px;color:var(--text3);flex:0 0 auto}
.link-item a{flex:1;color:var(--accent);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-item a:hover{text-decoration:underline}
.link-item .del{color:var(--text3)}.link-item .del:hover{color:var(--danger)}
.input{width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.side-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.side-blk{margin-bottom:20px}
.lab-chips{display:flex;flex-wrap:wrap;gap:6px}
.lab-chip{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;cursor:pointer}
.lab-chip.off{opacity:.32}
.stub{font-size:12.5px;color:var(--text3);border:1px dashed var(--border-strong);border-radius:var(--r-sm);padding:11px;text-align:center}

/* calculators */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.calc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px}
.calc h4{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.calc h4 .ico{width:15px;height:15px;color:var(--accent)}
.calc .crow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.calc .crow label{font-size:12.5px;color:var(--text2);flex:1}
.calc .crow input{width:120px;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);text-align:right}
.calc .cres{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:6px}
.calc .cres .r{display:flex;justify-content:space-between;font-size:13px}
.calc .cres .r .l{color:var(--text3)}
.calc .cres .r .v{font-weight:600}
.calc .cres .r.big .v{color:var(--accent);font-size:16px}

/* cmd palette */
.cmdk-overlay{align-items:flex-start;justify-content:center;padding-top:12vh}
.cmdk{width:560px;max-width:92vw;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-lg);overflow:hidden;animation:pop .14s}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.cmdk-in .ico{width:18px;height:18px;color:var(--text3)}
.cmdk-in input{flex:1;border:none;outline:none;font-size:16px;background:none}
.cmdk-res{max-height:52vh;overflow-y:auto;padding:6px}
.cmdk-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer}
.cmdk-row.sel,.cmdk-row:hover{background:var(--accent-soft)}
.cmdk-row .em{font-size:15px;width:20px;text-align:center}
.cmdk-row .t{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk-row .c{font-size:12px;color:var(--text3);flex:0 0 auto}
.cmdk-empty{padding:26px;text-align:center;color:var(--text3);font-size:13px}

.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:100%;max-width:540px;box-shadow:var(--sh-lg);margin:auto;animation:pop .14s}
.set-overlay{align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.modal-head{display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border)}
.modal-head b{font-size:15.5px}
.modal-body{padding:18px 22px;max-height:66vh;overflow-y:auto}
.modal-foot{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--border)}
.field{margin-bottom:16px}.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);text-transform:uppercase;margin-bottom:6px}
.hint{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.5}
.row-2{display:flex;gap:12px}.row-2>*{flex:1}.spacer{flex:1}

.disclaimer{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border:1px solid rgba(217,128,20,.25);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:12px;line-height:1.5}
.ai-spin{display:inline-block;width:15px;height:15px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip2{font-size:12px;font-weight:500;padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}

.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:10px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:14px;animation:up .2s}
.toast.err{background:var(--danger)}
.toast button{color:#a9b2ff;font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media(max-width:900px){.ws-body{grid-template-columns:1fr}.ws-side{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:18px}.ws-modal{width:94vw;height:90vh}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh-lg)}.sidebar.show{transform:none}.menu-btn{display:inline-flex!important}}
.menu-btn{display:none}

/* goals */
.goals-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px}
.goals-h{font-size:16px;font-weight:700;letter-spacing:-.02em}
.goals-sub{font-size:13px;color:var(--text3);margin-top:2px}
.goals-head .btn{margin-left:auto;flex:0 0 auto}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.goal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px;display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;align-items:center;gap:8px}
.goal-name{flex:1;min-width:0;font-size:15px;font-weight:600;border:none;background:none;outline:none;border-radius:6px;padding:3px 5px;letter-spacing:-.01em}
.goal-name:focus{background:var(--surface-hover)}
.goal-del{width:28px;height:28px;border-radius:6px;color:var(--text3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.goal-del:hover{background:var(--danger-soft);color:var(--danger)}
.goal-del .ico{width:15px;height:15px}
.goal-amt{font-size:21px;font-weight:700;letter-spacing:-.02em}
.goal-amt span{font-size:14px;font-weight:500;color:var(--text3)}
.goal-bar{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}
.goal-bar>div{height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.goal-pct{font-size:12px;color:var(--text3);font-weight:500}
.goal-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
.goal-fields label{font-size:11.5px;font-weight:600;color:var(--text2);display:flex;flex-direction:column;gap:4px}
.goal-fields input{padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);outline:none;font-weight:500}
.goal-fields input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.goal-res{border-top:1px dashed var(--border);padding-top:11px;margin-top:2px}
.goal-sip{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal-sip span{font-size:13px;color:var(--text2)}
.goal-sip b{font-size:18px;color:var(--accent);font-weight:700;letter-spacing:-.01em}
.goal-note2{font-size:12px;color:var(--text3);margin-top:5px;line-height:1.5}
.goal-res.ok{color:var(--success);font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.goal-res.ok .ico{width:16px;height:16px;flex:0 0 auto}
.goal-notes{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;resize:vertical;min-height:44px;outline:none;background:var(--bg);font-size:13px;line-height:1.5}
.goal-notes:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* journal */
.journal{display:flex;height:100%;overflow:hidden}
.jr-list{flex:0 0 264px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.jr-new{margin:14px 14px 8px;justify-content:center}
.jr-items{flex:1;overflow-y:auto;padding:2px 10px 14px;display:flex;flex-direction:column;gap:6px}
.jr-item{text-align:left;padding:10px 11px;border-radius:var(--r-sm);border:1px solid transparent;display:flex;flex-direction:column;gap:3px;transition:.12s}
.jr-item:hover{background:var(--surface-hover)}
.jr-item.active{background:var(--accent-soft);border-color:var(--accent-soft)}
.jr-item-top{display:flex;align-items:center;gap:7px}
.jr-mood{font-size:14px}
.jr-date{font-size:11.5px;color:var(--text3);font-weight:600}
.jr-item.active .jr-date{color:var(--accent)}
.jr-item-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.jr-item-snip{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-main{flex:1;overflow-y:auto;min-width:0}
.jr-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text3);text-align:center}
.jr-entry{max-width:720px;padding:22px 26px}
.jr-entry-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.jr-date-in{width:auto;flex:0 0 auto}
.jr-moods{display:flex;gap:3px}
.jr-moodb{width:34px;height:34px;border-radius:8px;font-size:18px;line-height:1;filter:grayscale(1);opacity:.45;transition:.12s}
.jr-moodb:hover{background:var(--surface-hover);filter:none;opacity:1}
.jr-moodb.sel{background:var(--accent-soft);filter:none;opacity:1}
.jr-title{width:100%;font-size:24px;font-weight:700;letter-spacing:-.02em;border:none;background:none;outline:none;padding:2px 0;margin-bottom:10px}
.jr-tags-row{display:flex;align-items:center;margin-bottom:14px}
.jr-tags-in{flex:1}
@media(max-width:680px){.jr-list{flex-basis:150px}.jr-entry{padding:16px}.jr-title{font-size:20px}}

/* documents */
.docs{display:flex;height:100%;overflow:hidden}
.docs-tree{flex:0 0 232px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.docs-tree-head{display:flex;align-items:center;padding:13px 12px 8px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.docs-newroot{margin-left:auto;width:20px;height:20px;border-radius:5px;color:var(--text3);display:flex;align-items:center;justify-content:center}
.docs-newroot:hover{background:var(--surface-hover);color:var(--accent)}
.docs-newroot .ico{width:14px;height:14px}
.docs-tree-body{flex:1;overflow-y:auto;padding:2px 8px 12px}
.doctree-row{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:6px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500}
.doctree-row:hover{background:var(--surface-hover);color:var(--text)}
.doctree-row.active{background:var(--accent-soft);color:var(--accent)}
.doctree-caret{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:transform .12s;flex:0 0 auto}
.doctree-caret svg{width:13px;height:13px}
.doctree-caret.open{transform:rotate(90deg)}
.doctree-caret.empty{visibility:hidden}
.doctree-ico{width:15px;height:15px;flex:0 0 auto;color:var(--warn)}
.doctree-row.active .doctree-ico{color:var(--accent)}
.doctree-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs-main{flex:1;overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.docs-bar{display:flex;align-items:center;gap:8px;padding:13px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.docs-bar .btn .ico{width:14px;height:14px}
.docs-crumb{display:flex;align-items:center;gap:3px;font-size:13.5px;min-width:0;flex-wrap:wrap}
.docs-crumbb{padding:3px 7px;border-radius:6px;color:var(--text2);font-weight:500}
.docs-crumbb:hover{background:var(--surface-hover);color:var(--text)}
.docs-crumbb.cur{color:var(--text);font-weight:600}
.docs-sep{color:var(--text3)}
.docs-grid{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px;align-content:start}
.doc-item{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);cursor:pointer;transition:box-shadow .14s,border-color .14s,transform .06s}
.doc-item:hover{box-shadow:var(--sh-md);border-color:var(--border-strong);transform:translateY(-1px)}
.doc-item-ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.doc-item.is-folder .doc-item-ic{background:var(--warn-soft);color:var(--warn)}
.doc-item.is-doc .doc-item-ic{background:var(--accent-soft);color:var(--accent)}
.doc-item-ic .ico{width:18px;height:18px}
.doc-item-body{flex:1;min-width:0}
.doc-item-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.doc-item-sub{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-item-menu{width:26px;height:26px;border-radius:6px;color:var(--text3);display:flex;align-items:center;justify-content:center;flex:0 0 auto;opacity:0;transition:.12s}
.doc-item:hover .doc-item-menu{opacity:1}
.doc-item-menu:hover{background:var(--surface-hover);color:var(--text)}
.doc-item-menu .ico{width:16px;height:16px}
.doc-editor{display:flex;flex-direction:column;height:100%}
.doc-editor-in{padding:20px 24px;max-width:760px;width:100%}
.doc-title{width:100%;font-size:24px;font-weight:700;letter-spacing:-.02em;border:none;background:none;outline:none;padding:2px 0;margin-bottom:12px;color:var(--text)}
@media(max-width:680px){.docs-tree{flex-basis:148px}.docs-grid{grid-template-columns:1fr 1fr;padding:12px}}
</style>

</div>

</div></div>

  </div>
  <div class="modal-foot"><div class="spacer"></div><button class="btn" id="setCloseBtn">Close</button><button class="btn btn-primary" id="setSave">Save</button></div>
</div></div>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h||'';return d.textContent||'';}
function num(v){const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function fmtMoney(n){const s=state.settings.currency||'';try{return s+Math.round(n).toLocaleString('en-IN');}catch(e){return s+Math.round(n).toLocaleString();}}
function fmtShort(n){const s=state.settings.currency||'';n=Math.round(n);const a=Math.abs(n);if(a>=1e7)return s+(n/1e7).toFixed(2)+'Cr';if(a>=1e5)return s+(n/1e5).toFixed(2)+'L';if(a>=1e3)return s+(n/1e3).toFixed(1)+'K';return s+n;}
function fmtDate(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return '';return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});}
function safeUrl(u){u=(u||'').trim();if(!u)return '';if(/^https?:\/\//i.test(u))return u;if(/^[\w.-]+\.[a-z]{2,}/i.test(u))return 'https://'+u;return '';}
function debounce(fn,ms){let t;return function(){clearTimeout(t);t=setTimeout(fn,ms);};}

function migrateV3(s){
  try{
    const raw=localStorage.getItem(V3);if(!raw)return;const old=JSON.parse(raw);if(!old.boards)return;
    const map={investments:'investments',interests:'interests',health:'health',career:'career',learning:'learning',journal:'journal'};
    Object.entries(map).forEach(([oid,sid])=>{
      const arr=old.boards[oid];const sec=s.sections.find(x=>x.id===sid);if(!arr||!arr.length||!sec)return;
      const tab=sec.tabs.find(t=>t.type==='board');if(!tab)return;
      const cards=arr.map(c=>{
        const cl=(c.goals||[]).map(g=>({id:uid(),title:g.title||'Goal',items:(g.items||[]).map(it=>({id:uid(),text:it.text,done:!!it.done}))}));
        let html=c.notes?'<p>'+esc(c.notes)+'</p>':'';
        if(c.inv)html+='<p>'+esc((c.inv.type||'')+' · current '+(c.inv.current||0)+' · invested '+(c.inv.invested||0)+' · '+(c.inv.rate||0)+'% p.a.')+'</p>';
        return mkCard({title:c.title||'Untitled',notesHtml:html,cover:c.color||'',links:(c.links||[]).filter(l=>l&&l.url),checklists:cl});
      });
      tab.columns.unshift({id:uid(),name:'Imported',color:'',collapsed:false,cards});
    });
  }catch(e){console.warn('migrate v3 failed',e);}
}
function load(){
  try{const raw=localStorage.getItem(LS);if(raw){state=JSON.parse(raw);normalize();upgradeV5();upgradeV6();return;}}catch(e){console.warn(e);}
  state=seed();migrateV3(state);save();
}
function normalize(){
  state.settings=Object.assign({currency:'₹',apiKey:'',model:'claude-sonnet-4-6',name:'Bharat',theme:'light'},state.settings||{});
  if(!Array.isArray(state.labels))state.labels=[];if(!Array.isArray(state.sections))state.sections=[];
  state.sections.forEach(sec=>{(sec.tabs||[]).forEach(t=>{
    if(t.type==='board'){(t.columns||[]).forEach(c=>{if(!Array.isArray(c.cards))c.cards=[];c.cards.forEach(cd=>{cd.labels=cd.labels||[];cd.checklists=cd.checklists||[];cd.links=cd.links||[];});});}
    if(t.type==='goals'&&!Array.isArray(t.goals))t.goals=[];
    if(t.type==='journal'&&!Array.isArray(t.entries))t.entries=[];
    if(t.type==='docs'){if(!t.tree||t.tree.type!=='folder')t.tree=docFolder('Documents');if(!t.expanded||typeof t.expanded!=='object')t.expanded={};}
  });if(!sec.activeTab&&sec.tabs[0])sec.activeTab=sec.tabs[0].id;});
}
function upgradeV5(){
  if(state.settings.upgradedV5)return;
  const inv=state.sections.find(s=>s.id==='investments');
  if(inv&&!inv.tabs.some(t=>t.type==='goals')){const bi=inv.tabs.findIndex(t=>t.type==='board');inv.tabs.splice(bi>=0?bi+1:1,0,goalsTab('Goals'));}
  const jr=state.sections.find(s=>s.id==='journal');
  if(jr&&!jr.tabs.some(t=>t.type==='journal')){const jt=journalTab('Journal');jr.tabs.unshift(jt);jr.activeTab=jt.id;}
  state.settings.upgradedV5=true;save();
}
function upgradeV6(){
  if(state.settings.upgradedV6)return;
  if(!state.sections.some(s=>s.id==='documents'))state.sections.push(seedDocsSection());
  state.settings.upgradedV6=true;save();
}
const saveNow=()=>{try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){if(/quota/i.test(e.name||e.message||''))toast('Storage full — export and trim data.',true);}};

function goOverview(){ui.view='overview';ui.sectionId=null;renderNav();renderMain();}
function goSection(id){ui.view='section';ui.sectionId=id;renderNav();renderMain();}
function curSection(){return state.sections.find(s=>s.id===ui.sectionId);}
function curTab(){const s=curSection();return s&&(s.tabs.find(t=>t.id===s.activeTab)||s.tabs[0]);}

function renderMain(){
  if(ui.clock){clearInterval(ui.clock);ui.clock=null;}
  const top=document.getElementById('topTitle');const content=document.getElementById('content');
  if(ui.view==='overview'){top.textContent='';content.innerHTML=`<div class="ov"><div class="hello"></div><div class="clock" id="ovClock"></div><div class="date" id="ovDate"></div></div>`;startClock(content);return;}
  const s=curSection();if(!s){goOverview();return;}

  content.innerHTML=`<div class="tabbar" id="tabbar"></div><div class="tabpane" id="tabpane"></div>`;
  renderTabbar(s);renderTab(s);

function startClock(content){
  const greetName=state.settings.name||'there';
  function upd(){const d=new Date();const hr=d.getHours();const g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
    const hello=content.querySelector('.hello');if(hello)hello.textContent=`${g}, ${greetName} 👋`;
    const c=document.getElementById('ovClock');if(c)c.textContent=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const dd=document.getElementById('ovDate');if(dd)dd.textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
  upd();ui.clock=setInterval(upd,1000*30);
}

/* tabbar */
function renderTabbar(s){
  const bar=document.getElementById('tabbar');
  const tabIcon=t=>t.type==='notes'?'note':t.type==='calculators'?'calc':t.type==='healthai'?'sparkle':t.type==='goals'?'target':t.type==='journal'?'book':t.type==='docs'?'folder':'board';
  bar.innerHTML=s.tabs.map(t=>`<button class="tab ${t.id===s.activeTab?'active':''}" data-tab="${t.id}"><span class="ti" data-ico="${tabIcon(t)}"></span>${esc(t.name)}</button>`).join('')
    +`<button class="tab-add" id="tabAdd" title="Add tab"><span class="ico" data-ico="plus"></span></button>`
    +`<div class="tab-tools"><button class="btn btn-icon btn-ghost btn-sm" id="secMenu" title="Section options"><span class="ico" data-ico="dots"></span></button></div>`;
  injectIcons(bar);
  bar.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick=()=>{s.activeTab=el.dataset.tab;save();renderTabbar(s);renderTab(s);};
    el.ondblclick=()=>renameTab(s,el.dataset.tab);
  });
  document.getElementById('tabAdd').onclick=e=>openTabAddMenu(e,s);
  document.getElementById('secMenu').onclick=e=>openSectionMenu(e,s);
}
function renderTab(s){
  const pane=document.getElementById('tabpane');const t=curTab();if(!t){pane.innerHTML='';return;}
  if(t.type==='board')renderBoard(pane,s,t);
  else if(t.type==='notes')renderNotesTab(pane,t);
  else if(t.type==='calculators')renderCalculators(pane,t);
  else if(t.type==='healthai')renderHealthAI(pane,t);
  else if(t.type==='goals')renderGoals(pane,t);
  else if(t.type==='journal')renderJournal(pane,t);
  else if(t.type==='docs')renderDocs(pane,t);
}
function renderSection(){const s=curSection();if(s){renderTabbar(s);renderTab(s);}}

/* ---------- board ---------- */
function cardFace(card){
  const labs=(card.labels||[]).map(id=>{const l=state.labels.find(x=>x.id===id);return l?`<span class="tlabel named" style="background:${l.color}">${esc(l.name)}</span>`:'';}).join('');
  const badges=[];
  if(card.due){const dd=new Date(card.due);const days=(dd-now())/86400000;const cls=days<0?'over':days<3?'soon':'';badges.push(`<span class="b badge-due ${cls}"><span class="ico" data-ico="cal"></span>${fmtDate(card.due)}</span>`);}
  let ci=0,ct=0;(card.checklists||[]).forEach(cl=>cl.items.forEach(it=>{ct++;if(it.done)ci++;}));
  if(ct)badges.push(`<span class="b badge-cl ${ci===ct?'done':''}"><span class="ico" data-ico="check"></span>${ci}/${ct}</span>`);
  if((card.links||[]).length)badges.push(`<span class="b"><span class="ico" data-ico="link"></span>${card.links.length}</span>`);
  if(stripHtml(card.notesHtml).trim())badges.push(`<span class="b"><span class="ico" data-ico="list"></span></span>`);
  return `<div class="tcard" data-card="${card.id}" draggable="true">${card.cover?`<div class="tcard-cover" style="background:${card.cover}"></div>`:''}<div class="tcard-in">${labs?`<div class="tcard-labels">${labs}</div>`:''}<div class="tcard-title">${esc(card.title)||'Untitled'}</div>${badges.length?`<div class="tcard-badges">${badges.join('')}</div>`:''}</div></div>`;
}
function renderBoard(pane,s,tab){
  pane.innerHTML=`<div class="board" id="board">`+tab.columns.map(c=>columnHTML(c)).join('')+`<div class="add-col"><button class="add-col-btn" id="addCol"><span class="ico" data-ico="plus"></span> Add list</button></div></div>`;
  injectIcons(pane);
  const board=pane.querySelector('#board');
  board.querySelectorAll('.tcard').forEach(el=>el.onclick=ev=>{if(el.classList.contains('dragging'))return;openCard(tab,el.closest('.tcolumn').dataset.col,el.dataset.card);});
  board.querySelectorAll('[data-addcard]').forEach(el=>el.onclick=()=>openComposer(el.dataset.addcard));
  board.querySelectorAll('[data-colmenu]').forEach(el=>el.onclick=ev=>openColMenu(ev,tab,el.dataset.colmenu));
  board.querySelectorAll('.col-title input').forEach(el=>{el.onblur=()=>{const c=tab.columns.find(c=>c.id===el.dataset.coltitle);if(c){c.name=el.value.trim()||c.name;save();}};el.onkeydown=e=>{if(e.key==='Enter')el.blur();};});
  pane.querySelector('#addCol').onclick=()=>{tab.columns.push({id:uid(),name:'New list',color:'',collapsed:false,cards:[]});save();renderTab(s);};
  setupBoardDnD(board,s,tab);
  if(ui._composer){const cid=ui._composer;ui._composer=null;openComposer(cid);}
}
function columnHTML(c){
  return `<div class="tcolumn ${c.collapsed?'collapsed':''}" data-col="${c.id}" style="${c.color?`box-shadow:inset 4px 0 0 ${c.color}`:''}">
    <div class="col-head"><div class="col-title"><input value="${esc(c.name)}" data-coltitle="${c.id}"></div><span class="col-count">${c.cards.length}</span><button class="col-menu-btn" data-colmenu="${c.id}"><span class="ico" data-ico="dots"></span></button></div>
    <div class="col-cards" data-cards="${c.id}">${c.cards.map(cardFace).join('')}</div>
    <div class="col-foot"><button class="add-card-btn" data-addcard="${c.id}"><span class="ico" data-ico="plus"></span> Add a card</button></div>
  </div>`;
}
function openComposer(colId){
  const colEl=document.querySelector(`.tcolumn[data-col="${colId}"]`);if(!colEl)return;
  const foot=colEl.querySelector('.col-foot');
  foot.innerHTML=`<div class="composer"><textarea placeholder="Enter a title…"></textarea><div class="row"><button class="btn btn-primary btn-sm" data-add>Add card</button><button class="btn btn-sm" data-cancel>Cancel</button></div></div>`;
  const ta=foot.querySelector('textarea');ta.focus();
  const s=curSection(),tab=curTab(),c=tab.columns.find(c=>c.id===colId);
  const add=()=>{const v=ta.value.trim();if(v){c.cards.push(mkCard({title:v}));save();}ui._composer=v?colId:null;renderTab(s);};
  foot.querySelector('[data-add]').onclick=add;
  foot.querySelector('[data-cancel]').onclick=()=>renderTab(s);
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add();}if(e.key==='Escape')renderTab(s);};

function setupBoardDnD(board,s,tab){
  let mode=null,el=null;
  board.querySelectorAll('.tcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{mode='card';el=card;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.stopPropagation();});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');if(mode==='card')commitBoard(board,tab);mode=null;el=null;});
  });
  board.querySelectorAll('.col-cards').forEach(cont=>cont.addEventListener('dragover',e=>{if(mode!=='card'||!el)return;e.preventDefault();const a=afterY(cont,e.clientY);if(a==null)cont.appendChild(el);else cont.insertBefore(el,a);}));
  board.querySelectorAll('.tcolumn').forEach(c=>{
    const head=c.querySelector('.col-head');
    if(head)head.addEventListener('mousedown',e=>{if(e.target.closest('input')||e.target.closest('.col-menu-btn'))c.removeAttribute('draggable');else c.setAttribute('draggable','true');});
    c.addEventListener('dragstart',e=>{if(mode==='card')return;mode='col';el=c;c.classList.add('col-dragging');e.dataTransfer.effectAllowed='move';});
    c.addEventListener('dragend',()=>{c.classList.remove('col-dragging');c.removeAttribute('draggable');if(mode==='col')commitBoard(board,tab);mode=null;el=null;});
  });
  board.addEventListener('dragover',e=>{if(mode!=='col'||!el)return;e.preventDefault();const a=afterX(board,e.clientX);const addc=board.querySelector('.add-col');if(a==null)board.insertBefore(el,addc);else board.insertBefore(el,a);});
}
function afterY(cont,y){const els=[...cont.querySelectorAll('.tcard:not(.dragging)')];let best={d:-Infinity,el:null};els.forEach(c=>{const b=c.getBoundingClientRect();const off=y-b.top-b.height/2;if(off<0&&off>best.d)best={d:off,el:c};});return best.el;}
function afterX(board,x){const els=[...board.querySelectorAll('.tcolumn:not(.col-dragging)')];let best={d:-Infinity,el:null};els.forEach(c=>{const b=c.getBoundingClientRect();const off=x-b.left-b.width/2;if(off<0&&off>best.d)best={d:off,el:c};});return best.el;}
function commitBoard(board,tab){
  const cmap={};tab.columns.forEach(c=>c.cards.forEach(cd=>cmap[cd.id]=cd));
  const colmap={};tab.columns.forEach(c=>colmap[c.id]=c);
  tab.columns=[...board.querySelectorAll('.tcolumn')].map(colEl=>{const c=colmap[colEl.dataset.col];if(!c)return null;c.cards=[...colEl.querySelectorAll('.tcard')].map(e=>cmap[e.dataset.card]).filter(Boolean);return c;}).filter(Boolean);
  save();renderTab(curSection());
}

/* ---------- calculators ---------- */
function calcSIP(P,r,y){const i=r/100/12,n=y*12;const fv=i===0?P*n:P*((Math.pow(1+i,n)-1)/i);const inv=P*n;return[['Maturity value',fmtMoney(fv),1],['Invested',fmtMoney(inv)],['Est. gains',fmtMoney(fv-inv)]];}
function calcStep(P,r,y,s){const i=r/100/12;let fv=0,inv=0,m=P;for(let k=0;k<y;k++){for(let j=0;j<12;j++){fv=(fv+m)*(1+i);inv+=m;}m=m*(1+s/100);}return[['Maturity value',fmtMoney(fv),1],['Invested',fmtMoney(inv)],['Est. gains',fmtMoney(fv-inv)]];}
function calcLump(P,r,y){const fv=P*Math.pow(1+r/100,y);return[['Future value',fmtMoney(fv),1],['Invested',fmtMoney(P)],['Est. gains',fmtMoney(fv-P)]];}
function calcGoal(T,r,y){const i=r/100/12,n=y*12;const P=i===0?T/n:T*i/(Math.pow(1+i,n)-1);return[['Monthly SIP needed',fmtMoney(P),1],['Target',fmtMoney(T)],['Total invested',fmtMoney(P*n)]];}
function calcFD(P,r,y){const fv=P*Math.pow(1+(r/100)/4,4*y);return[['Maturity value',fmtMoney(fv),1],['Principal',fmtMoney(P)],['Interest',fmtMoney(fv-P)]];}
function calcPPF(A,r,y){const rr=r/100;const fv=rr===0?A*y:A*((Math.pow(1+rr,y)-1)/rr)*(1+rr);return[['Maturity value',fmtMoney(fv),1],['Invested',fmtMoney(A*y)],['Interest',fmtMoney(fv-A*y)]];}
const CALC_DEFS=[
  {k:'sip',name:'SIP',f:[['P','Monthly investment'],['rate','Expected return % p.a.'],['years','Years']],fn:v=>calcSIP(v.P,v.rate,v.years)},
  {k:'step',name:'Step-up SIP',f:[['P','Starting monthly'],['rate','Return % p.a.'],['years','Years'],['step','Annual step-up %']],fn:v=>calcStep(v.P,v.rate,v.years,v.step)},
  {k:'lump',name:'Lumpsum',f:[['P','Amount'],['rate','Return % p.a.'],['years','Years']],fn:v=>calcLump(v.P,v.rate,v.years)},
  {k:'goal',name:'Goal planner (reverse SIP)',f:[['T','Target amount'],['rate','Return % p.a.'],['years','Years']],fn:v=>calcGoal(v.T,v.rate,v.years)},
  {k:'fd',name:'Fixed Deposit',f:[['P','Principal'],['rate','Rate % p.a.'],['years','Years']],fn:v=>calcFD(v.P,v.rate,v.years)},
  {k:'ppf',name:'PPF',f:[['A','Yearly contribution'],['rate','Rate % p.a.'],['years','Years']],fn:v=>calcPPF(v.A,v.rate,v.years)}
];
function renderCalculators(pane,tab){
  if(!tab.calc)tab.calc={};
  pane.innerHTML=`<div class="pane-pad"><div class="disclaimer">Projections assume a constant return and are illustrative only — not guaranteed, and not financial advice.</div><div class="calc-grid">`+CALC_DEFS.map(d=>{
    const v=tab.calc[d.k]||(tab.calc[d.k]={});d.f.forEach(([key])=>{if(v[key]==null)v[key]=0;});

async function analyzeHealth(tab){
  const key=(state.settings.apiKey||'').trim();if(!key){toast('Add your Anthropic API key in Settings.',true);openSettings();return;}
  if(!tab.file){toast('Choose a PDF or image first.',true);return;}
  tab.aiBusy=true;tab.aiError=null;renderTab(curSection());
  const b64=String(tab.file.dataUrl).split(',')[1]||'';
  const block=tab.file.type==='application/pdf'?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:tab.file.type,data:b64}};
  const prompt='You are a careful health assistant for a layperson. Analyze the attached blood test and reply with ONLY JSON: {"summary","focusAreas":[],"organs":[],"flaggedMarkers":[{"name","value","status","note"}],"suggestions":[],"disclaimer"}. Avoid alarming language, never prescribe, recommend a doctor. If not a blood test, say so in summary.';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:state.settings.model||'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:[block,{type:'text',text:prompt}]}]})});
    if(!res.ok){let m='Request failed ('+res.status+')';try{const er=await res.json();if(er.error&&er.error.message)m=er.error.message;}catch(e){}if(res.status===401)m='Invalid API key.';throw new Error(m);}
    const data=await res.json();let t=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    let p;try{p=JSON.parse(t);}catch(e){const mm=t.match(/\{[\s\S]*\}/);p=mm?JSON.parse(mm[0]):{summary:t};}
    tab.ai=p;tab.aiBusy=false;save();renderTab(curSection());toast('Analysis complete.');
  }catch(err){tab.aiBusy=false;tab.aiError=/Failed to fetch|NetworkError/i.test(err.message)?'Network/CORS error reaching Anthropic.':('Failed: '+err.message);renderTab(curSection());}
}

/* ---------- goals ---------- */
function goalCompute(g){
  const T=num(g.target),C=num(g.current),y=Math.max(0,num(g.years)),r=num(g.rate);
  const i=r/100/12,n=Math.round(y*12);
  const fvCur=C*Math.pow(1+r/100,y);
  const rem=Math.max(0,T-fvCur);
  const sip=(rem>0&&n>0)?(i===0?rem/n:rem*i/(Math.pow(1+i,n)-1)):0;
  const pct=T>0?Math.min(100,Math.round(C/T*100)):0;
  const year=new Date().getFullYear()+Math.round(y);
  return {T,C,y,r,fvCur,rem,sip,pct,year,onTrack:T>0&&fvCur>=T};
}
function goalResHTML(c){
  return c.onTrack
    ? `<span class="ico" data-ico="check"></span> Your current savings should reach this goal on their own.`
    : `<div class="goal-sip"><span>Monthly SIP needed</span><b>${fmtMoney(c.sip)}</b></div><div class="goal-note2">Current savings grow to ${fmtShort(c.fvCur)}; the SIP covers the ${fmtShort(c.rem)} gap by ${c.year}.</div>`;
}
function renderGoals(pane,tab){

    <div class="goal-grid" id="goalGrid"></div></div>`;
  injectIcons(pane);
  pane.querySelector('#addGoal').onclick=()=>{tab.goals.unshift(mkGoal({name:'New goal'}));save();renderGoals(pane,tab);};

    return `<div class="goal" data-gi="${i}">
      <div class="goal-top"><input class="goal-name" data-gname="${i}" value="${esc(g.name)}" placeholder="Goal name"><button class="goal-del" data-gdel="${i}" title="Delete goal"><span class="ico" data-ico="trash"></span></button></div>

        <label>Return % p.a.<input type="number" step="any" data-gf="${i}.rate" value="${c.r}"></label>

  }).join('');
  injectIcons(grid);

function updateGoalCard(grid,tab,i){

/* ---------- documents ---------- */
function docWalk(node,cb){if(!node)return;cb(node);(node.children||[]).forEach(c=>docWalk(c,cb));}
function docFind(root,id){let f=null;docWalk(root,n=>{if(n.id===id)f=n;});return f;}
function docParent(root,id){let p=null;docWalk(root,n=>{if((n.children||[]).some(c=>c.id===id))p=n;});return p;}
function docPath(root,id){const path=[];(function rec(node,trail){if(node.id===id){path.push(...trail,node);return true;}for(const c of (node.children||[])){if(c.type==='folder'&&rec(c,trail.concat(node)))return true;}return false;})(root,[]);return path.length?path:[root];}
function docFolderCwd(tab){if(!tab.cwd)tab.cwd=tab.tree.id;let f=docFind(tab.tree,tab.cwd);if(!f||f.type!=='folder'){tab.cwd=tab.tree.id;f=tab.tree;}return f;}

function renderDocs(pane,tab){
  if(!tab.tree||tab.tree.type!=='folder')tab.tree=docFolder('Documents');

  pane.innerHTML=`<div class="docs"><div class="docs-tree"><div class="docs-tree-head">Folders <button class="docs-newroot" id="docNewRoot" title="New top-level folder"><span class="ico" data-ico="plus"></span></button></div><div class="docs-tree-body" id="docTree"></div></div><div class="docs-main" id="docMain"></div></div>`;
  injectIcons(pane);

  renderDocTree(pane,tab);renderDocMain(pane,tab);
}
function renderDocTree(pane,tab){

  function row(node,depth){
    const subs=(node.children||[]).filter(c=>c.type==='folder');

    let h=`<div class="doctree-row ${active?'active':''}" data-df="${node.id}" style="padding-left:${8+depth*13}px"><span class="doctree-caret ${subs.length?'':'empty'} ${exp?'open':''}" data-dcaret="${node.id}">${subs.length?ico('chevron'):''}</span><span class="ico doctree-ico" data-ico="folder"></span><span class="doctree-name">${esc(node.name)}</span></div>`;
    if(exp&&subs.length)h+=subs.map(c=>row(c,depth+1)).join('');
    return h;
  }
  box.innerHTML=row(tab.tree,0);injectIcons(box);
  box.querySelectorAll('[data-dcaret]').forEach(el=>el.onclick=e=>{e.stopPropagation();const n=docFind(tab.tree,el.dataset.dcaret);if(n&&(n.children||[]).some(c=>c.type==='folder')){tab.expanded[n.id]=!tab.expanded[n.id];save();renderDocTree(pane,tab);}});
  box.querySelectorAll('[data-df]').forEach(el=>el.onclick=()=>{tab.cwd=el.dataset.df;tab.open=null;tab.expanded[el.dataset.df]=true;save();renderDocTree(pane,tab);renderDocMain(pane,tab);});
}
function docPreview(doc){const t=stripHtml(doc.html).trim();return t?t.slice(0,52):'Empty document';}
function docItemHTML(node){

function renderDocMain(pane,tab){

  });

function openDocItemMenu(ev,pane,tab,id){
  const node=docFind(tab.tree,id);if(!node)return;const isF=node.type==='folder';const r=ev.currentTarget.getBoundingClientRect();
  const p=popup(r.left-158,r.bottom+4,`<button data-a="open"><span class="ico" data-ico="${isF?'folder':'doc'}"></span> Open</button><button data-a="rename"><span class="ico" data-ico="note"></span> Rename</button><div class="sep"></div><button class="danger" data-a="del"><span class="ico" data-ico="trash"></span> Delete</button>`);
  p.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{const a=el.dataset.a;closeMenu();
    if(a==='open'){if(isF){tab.cwd=id;tab.open=null;tab.expanded[id]=true;}else tab.open=id;save();renderDocTree(pane,tab);renderDocMain(pane,tab);}
    else if(a==='rename'){const nn=prompt(isF?'Rename folder':'Rename document',node.name);if(nn&&nn.trim()){node.name=nn.trim();if(!isF)node.updatedAt=now();save();renderDocTree(pane,tab);renderDocMain(pane,tab);}}
    else if(a==='del'){const kids=isF&&(node.children||[]).length;if(kids&&!confirm(`Delete “${node.name}” and everything inside it?`))return;if(!isF&&stripHtml(node.html).trim()&&!confirm(`Delete “${node.name}”?`))return;const par=docParent(tab.tree,id);if(par){par.children=par.children.filter(c=>c.id!==id);if(tab.cwd===id)tab.cwd=par.id;if(tab.open===id)tab.open=null;save();renderDocTree(pane,tab);renderDocMain(pane,tab);}}
  });
}
function docCreateFolder(pane,tab,parentId){const par=docFind(tab.tree,parentId);if(!par)return;const n=prompt('Folder name','New folder');if(n===null)return;const f=docFolder((n||'').trim()||'New folder');par.children.push(f);tab.expanded[parentId]=true;tab.cwd=parentId;tab.open=null;save();renderDocTree(pane,tab);renderDocMain(pane,tab);}
function docCreateDoc(pane,tab,parentId){const par=docFind(tab.tree,parentId);if(!par)return;const n=prompt('Document name','Untitled');if(n===null)return;const d=docFile((n||'').trim()||'Untitled');par.children.push(d);tab.cwd=parentId;tab.open=d.id;save();renderDocTree(pane,tab);renderDocMain(pane,tab);setTimeout(()=>{const ti=document.getElementById('docEd');if(ti)ti.focus();},30);}
function renderDocEditor(main,pane,tab,doc){
  const par=docParent(tab.tree,doc.id)||tab.tree;
  main.innerHTML=`<div class="doc-editor"><div class="docs-bar"><button class="btn btn-sm" id="docBack"><span class="ico" data-ico="chevronL"></span> Back</button><div class="docs-crumb" style="margin-left:2px"><span class="docs-crumbb" data-dback>${esc(par.name)}</span><span class="docs-sep">/</span><span class="docs-crumbb cur">${esc(doc.name)}</span></div><div class="spacer"></div><button class="btn btn-sm btn-danger" id="docDel"><span class="ico" data-ico="trash"></span> Delete</button></div><div class="doc-editor-in"><input class="doc-title" id="docTitle" value="${esc(doc.name)}" placeholder="Document title…"><div class="rt-toolbar" id="docTb"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-block="H2">H</button><button data-cmd="insertUnorderedList"><span class="ico" data-ico="list"></span></button><button data-cmd="insertOrderedList">1.</button><button data-cmd="createLink"><span class="ico" data-ico="link"></span></button></div><div class="rt-editor big" id="docEd" contenteditable="true" data-ph="Write your document…">${doc.html||''}</div></div></div>`;
  injectIcons(main);
  const back=()=>{tab.open=null;tab.cwd=par.id;save();renderDocTree(pane,tab);renderDocMain(pane,tab);};
  main.querySelector('#docBack').onclick=back;main.querySelector('[data-dback]').onclick=back;
  const ed=main.querySelector('#docEd');
  ed.oninput=()=>{doc.html=ed.innerHTML;doc.updatedAt=now();saveDebounced();};
  main.querySelector('#docTitle').oninput=e=>{doc.name=e.target.value;doc.updatedAt=now();saveDebounced();renderDocTree(pane,tab);};
  main.querySelectorAll('#docTb [data-cmd]').forEach(b=>b.onmousedown=e=>{e.preventDefault();const c=b.dataset.cmd;if(c==='createLink'){const u=safeUrl(prompt('Link URL'));if(u)document.execCommand('createLink',false,u);}else document.execCommand(c,false,null);ed.focus();doc.html=ed.innerHTML;saveDebounced();});
  main.querySelector('#docTb [data-block]').onmousedown=e=>{e.preventDefault();document.execCommand('formatBlock',false,'H2');ed.focus();doc.html=ed.innerHTML;saveDebounced();};
  main.querySelector('#docDel').onclick=()=>{if(stripHtml(doc.html).trim()&&!confirm(`Delete “${doc.name}”?`))return;const p2=docParent(tab.tree,doc.id);if(p2){p2.children=p2.children.filter(c=>c.id!==doc.id);tab.open=null;tab.cwd=p2.id;save();renderDocTree(pane,tab);renderDocMain(pane,tab);}};
}

/* ---------- theme ---------- */
function applyTheme(){
  const dark=!!(state&&state.settings&&state.settings.theme==='dark');
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  const ic=document.querySelector('#themeBtn [data-ico]');
  if(ic){ic.dataset.ico=dark?'sun':'moon';ic.dataset.k='';injectIcons(document.getElementById('themeBtn'));}
  const lbl=document.getElementById('themeLbl');if(lbl)lbl.textContent=dark?'Light mode':'Dark mode';
}
function toggleTheme(){state.settings.theme=(state.settings.theme==='dark')?'light':'dark';saveNow();applyTheme();}

/* ---------- command palette ---------- */
function allCards(){const out=[];state.sections.forEach(s=>s.tabs.forEach(t=>{if(t.type==='board')t.columns.forEach(c=>c.cards.forEach(cd=>out.push({card:cd,s,t,c})));}));return out;}
function openCmdk(){document.getElementById('cmdkOverlay').classList.add('open');const inp=document.getElementById('cmdkInput');inp.value='';cmdkSearch('');setTimeout(()=>inp.focus(),30);}
function closeCmdk(){document.getElementById('cmdkOverlay').classList.remove('open');}
function cmdkSearch(q){
  q=q.toLowerCase().trim();let list=allCards();
  if(q)list=list.filter(x=>(x.card.title+' '+stripHtml(x.card.notesHtml)+' '+x.s.name+' '+x.c.name).toLowerCase().includes(q));
  list=list.slice(0,40);ui.cmdkList=list;ui.cmdkSel=0;
  const res=document.getElementById('cmdkRes');
  res.innerHTML=list.length?list.map((x,i)=>`<div class="cmdk-row ${i===0?'sel':''}" data-i="${i}"><span class="em">${esc(x.s.emoji||'•')}</span><span class="t">${esc(x.card.title)||'Untitled'}</span><span class="c">${esc(x.s.name)} › ${esc(x.c.name)}</span></div>`).join(''):`<div class="cmdk-empty">No cards found</div>`;
  res.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>cmdkOpen(+el.dataset.i));
}
function cmdkOpen(i){const x=ui.cmdkList[i];if(!x)return;closeCmdk();goSection(x.s.id);x.s.activeTab=x.t.id;save();renderSection();setTimeout(()=>openCard(x.t,x.c.id,x.card.id),60);}
function cmdkMove(d){const rows=document.querySelectorAll('.cmdk-row');if(!rows.length)return;ui.cmdkSel=(ui.cmdkSel+d+rows.length)%rows.length;rows.forEach((r,i)=>r.classList.toggle('sel',i===ui.cmdkSel));rows[ui.cmdkSel].scrollIntoView({block:'nearest'});}

/* ---------- settings ---------- */
function openSettings(){document.getElementById('setApiKey').value=state.settings.apiKey||'';document.getElementById('setModel').value=state.settings.model||'';document.getElementById('setCurrency').value=state.settings.currency||'';document.getElementById('setOverlay').classList.add('open');injectIcons(document.getElementById('setOverlay'));}
function closeSettings(){document.getElementById('setOverlay').classList.remove('open');}
function saveSettings(){state.settings.apiKey=document.getElementById('setApiKey').value.trim();state.settings.model=document.getElementById('setModel').value.trim()||'claude-sonnet-4-6';state.settings.currency=document.getElementById('setCurrency').value;saveNow();closeSettings();renderMain();toast('Settings saved.');}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='life-dashboard-'+todayStr()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Exported.');}
function importData(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.sections)throw new Error('Not a v4 backup');state=o;normalize();saveNow();closeSettings();goOverview();toast('Imported.');}catch(e){toast('Import failed: '+e.message,true);}};r.readAsText(f);}
function clearData(){if(!confirm('Erase ALL data in this browser?'))return;localStorage.removeItem(LS);state=seed();saveNow();goOverview();toast('Cleared.');}

/* ---------- toast ---------- */
function toast(msg,err,actionLabel,action){const wrap=document.getElementById('toasts');const t=document.createElement('div');t.className='toast'+(err?' err':'');t.innerHTML=`<span>${esc(msg)}</span>`;if(actionLabel){const b=document.createElement('button');b.textContent=actionLabel;b.onclick=()=>{action&&action();t.remove();};t.appendChild(b);}wrap.appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateY(8px)';setTimeout(()=>t.remove(),300);},action?6000:err?4200:2200);}

/* ---------- init ---------- */
function init(){
  load();injectIcons(document);applyTheme();renderNav();goOverview();
  document.getElementById('navOverview').onclick=()=>{goOverview();document.getElementById('sidebar').classList.remove('show');};
  document.getElementById('addSectionBtn').onclick=addSection;
  document.getElementById('themeBtn').onclick=toggleTheme;
  document.getElementById('settingsBtn').onclick=openSettings;
  document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('cmdkBtn').onclick=openCmdk;
  document.getElementById('wsClose').onclick=closeCard;
  document.getElementById('wsDelete').onclick=deleteCardFromModal;
  document.getElementById('wsTitle').oninput=()=>{if(ui.card){ui.card.card.title=document.getElementById('wsTitle').value;touchCard();}};
  document.getElementById('wsCoverBtn').onclick=()=>{const c=ui.card.card;const i=COVER_COLORS.indexOf(c.cover);c.cover=COVER_COLORS[(i+1)%COVER_COLORS.length];setCover(c.cover);touchCard();renderWsSide();};
  document.getElementById('wsOverlay').onclick=e=>{if(e.target.id==='wsOverlay')closeCard();};
  document.getElementById('cmdkOverlay').onclick=e=>{if(e.target.id==='cmdkOverlay')closeCmdk();};
  document.getElementById('cmdkInput').oninput=e=>cmdkSearch(e.target.value);
  document.getElementById('cmdkInput').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();cmdkMove(1);}else if(e.key==='ArrowUp'){e.preventDefault();cmdkMove(-1);}else if(e.key==='Enter'){e.preventDefault();cmdkOpen(ui.cmdkSel);}else if(e.key==='Escape')closeCmdk();};
  document.getElementById('setClose').onclick=closeSettings;document.getElementById('setCloseBtn').onclick=closeSettings;document.getElementById('setSave').onclick=saveSettings;
  document.getElementById('setOverlay').onclick=e=>{if(e.target.id==='setOverlay')closeSettings();};
  document.getElementById('exportBtn').onclick=exportData;
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';};
  document.getElementById('clearBtn').onclick=clearData;
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const o=document.getElementById('cmdkOverlay').classList.contains('open');o?closeCmdk():openCmdk();return;}
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&ui.card){e.preventDefault();closeCard();return;}
    if(e.key==='Escape'){if(ui.menu)closeMenu();if(document.getElementById('cmdkOverlay').classList.contains('open'))closeCmdk();else if(ui.card)closeCard();else closeSettings();return;}
    const tag=(e.target.tagName||'').toLowerCase();const editing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
    if(editing)return;
    if(e.key==='n'&&ui.view==='section'){const t=curTab();if(t&&t.type==='board'&&t.columns[0]){e.preventDefault();openComposer(t.columns[0].id);}}
  });
  window.addEventListener('resize',closeMenu);
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
